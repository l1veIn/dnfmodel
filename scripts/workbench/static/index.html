<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>补丁工作台</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dash.css">
</head>
<body class="dashboard">
<header class="top">
  <a class="brand" href="#/">补丁工作台</a>
  <nav class="nav"><a id="navProjects" href="#/">项目</a><a id="navStudio" href="#/studio">试衣间</a><a id="navGame" href="#/game">DNF 资源</a></nav>
  <span id="crumb" class="muted"></span>
  <span class="spacer"></span>
  <span id="gameLine" class="small muted"></span>
  <button id="refresh" type="button">刷新</button>
</header>
<div id="page" class="page"></div>

<div id="docOverlay" hidden>
  <div class="sheet doc" role="dialog" aria-labelledby="docTitle">
    <div class="row"><h3 id="docTitle"></h3><span class="spacer"></span><button id="docClose" type="button">关闭</button></div>
    <article id="docBody"></article>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/static/game.js"></script>
<script src="/static/studio.js"></script>
<script src="/static/dash.js"></script>
</body>
</html>
