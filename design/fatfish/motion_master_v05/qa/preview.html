<main><h1>大肥鱼 v05.1 · 主帧与动作小样</h1><p>第三帧已撤销碰到前腿的局部变形，第四帧已修复袖口与手腕连接。锁定 v04 站姿，仍只包含原来的 6 张动作测试。</p>

let mode='walk',index=0,playing=true,last=0,reset=false;
const $=id=>document.getElementById(id),lookup=Object.fromEntries(frames.map(x=>[x.name,x]));
async function init(){if(window.innerWidth<1160)$('zoom').value=window.innerWidth<790?'1':'2';await Promise.all(frames.flatMap(f=>['original','before','after'].map(k=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{f[k+'Image']=im;resolve()};im.onerror=reject;im.src=f[k]}))));draw();requestAnimationFrame(tick)}
function current(){return lookup[mode==='walk'?'walk_'+String(index).padStart(3,'0'):mode]}
function draw(){const f=current(),zoom=Number($('zoom').value),ground=mode==='walk'&&$('motion').value==='ground';
  const dx=ground?278-f.sole[0]:0,dy=ground?386-f.sole[1]:0;
  for(const [id,im] of [['source',f.originalImage],['target',f[$('correction').value+'Image']]]){let canvas=$(id),ctx=canvas.getContext('2d');canvas.style.width=176*zoom+'px';canvas.style.height=160*zoom+'px';ctx.imageSmoothingEnabled=false;ctx.fillStyle='#101722';ctx.fillRect(0,0,176,160);
    if(reset){ctx.fillStyle='#c9d9e9';ctx.font='11px sans-serif';ctx.fillText('4 帧片段结束，随后重播',15,80)}else{ctx.drawImage(im,dx-178,dy-260);ctx.strokeStyle='#92713f';ctx.beginPath();ctx.moveTo(0,126.5);ctx.lineTo(176,126.5);ctx.stroke();if(ground){ctx.fillStyle='#ddbd78';ctx.fillRect(100,122,1,9)}}}
  $('status').textContent=reset?'片段重播':`IMG ${String(f.frame).padStart(3,'0')} · ${mode==='walk'?(index+1)+'/4':'单帧'}`;$('frame').value=index;$('speedText').textContent=$('speed').value+'ms';$('play').textContent=playing?'暂停':'播放';}
function tick(now){if(playing&&mode==='walk'){let duration=reset?500:index===3?650:Number($('speed').value);if(now-last>=duration){if(reset){reset=false;index=0}else if(index===3){reset=true}else{index++}last=now;draw()}}requestAnimationFrame(tick)}
$('play').onclick=()=>{playing=!playing;last=performance.now();draw()};$('frame').oninput=()=>{index=Number($('frame').value);playing=false;reset=false;draw()};
for(let id of ['motion','correction','zoom','speed'])$(id).oninput=draw;
for(let button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode=button.dataset.mode;index=0;reset=false;last=performance.now();for(let b of document.querySelectorAll('[data-mode]'))b.classList.toggle('active',b===button);$('frame').disabled=mode!=='walk';draw()};
